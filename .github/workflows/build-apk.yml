name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version is lower than 17. Required: >=17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create debug.keystore."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching app/build/outputs/apk for generated APKs:"
            find app/build/outputs/apk -type f
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file exists but is empty."
            exit 1
          fi
          echo "APK successfully verified at $APK_PATH."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(basename "${{ github.repository }}" | sed 's/[^a-zA-Z0-9_-]/-/g')
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty: $ASSET_PATH"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES="This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          The GitHub Actions run number: ${{ github.run_number }}
          The GitHub Actions run attempt: ${{ github.run_attempt }}
          The source commit SHA: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore."
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release successfully created!"
            gh release view "$TAG"
            
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            REPO_NAME=$(basename "${{ github.repository }}" | sed 's/[^a-zA-Z0-9_-]/-/g')
            RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
            
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: $RELEASE_FILENAME"
            
            echo "### Release Published Successfully 🚀" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded from the release Assets section: $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed!"
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."
            
            echo "### WARNING: Release Publishing Failed ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but creating the GitHub Release failed." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named app-debug-apk remains available for download." >> $GITHUB_STEP_SUMMARY
          fi
